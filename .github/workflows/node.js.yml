name: Frontend-Photobogota

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permisos necesarios para que el Action pueda escribir en la rama gh-pages
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9          # la versión que estemos usando

    - name: Configurar Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'      

    - name: Instalar dependencias
      run: pnpm install

    - name: Construir proyecto (Vite)
      run: pnpm run build

    - name: Deploy
      if: github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist
        branch: gh-pages